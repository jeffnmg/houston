apiVersion: v1
kind: ServiceAccount
metadata:
  name: houston-control-plane
  namespace: houston-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: houston-control-plane
rules:
  - apiGroups: [""]
    resources: ["namespaces", "secrets", "persistentvolumeclaims", "services", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: houston-control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: houston-control-plane
subjects:
  - kind: ServiceAccount
    name: houston-control-plane
    namespace: houston-system
